[project]
name = "drl-battery-cycles"
version = "0.1.0"
description = "DRL for battery cycle optimisation against the Australian NEM"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.4",
    "pulp==3.3.0",
    "highspy==1.14.0",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "openpyxl==3.1.5",
    "requests==2.33.1",
    "torch==2.11.0",
    "nemosis==3.8.1",
    "gymnasium==1.3.0",
    "pytest==8.4.2",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "nemseer==1.0.7",
    "pyarrow==25.0.1",
    "plotly==6.5.1",
    "dash==3.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Tests sit beside the code they cover, so collection starts at the root. Setting this
# key REPLACES pytest's default list, so the default entries are repeated here. Dropping
# `.*` lets collection walk into `.claude/worktrees/`, where every test module has the
# same basename as one here, and pytest then fails all of them on an import mismatch.
# `runs/space` is the publishSpace.sh staging copy and holds the same modules again.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "runs", "data_cache", "models", "trainedPolicies", "results",
]
# One test group needs the nemosis price cache and skips itself without it
# (optimisation/test_dp.py:needsPrices), so the suite runs with no network.
addopts = "-q"

[tool.ruff]
# The house style wraps near 90, not at ruff's default 88. This sets the width
# `ruff format` would use. The lint rules below do not include E501, so an over-long
# line is not an error: 192 lines already exceed 90 and reflowing them would bury
# every real finding.
line-length = 90
# Not a test tree, not this project's code.
extend-exclude = ["runs", "data_cache", ".venv"]

[tool.ruff.lint]
# Ruff's default set: pycodestyle errors, pyflakes. It catches undefined names,
# unused imports and syntax faults, which is what a refactor of this size breaks.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Importing a pytest fixture is how a test module reuses one, and the test function
# then takes it as a parameter. Ruff reads that parameter as redefining the import,
# so F811 fires 34 times on test_app.py alone and means nothing in a test module.
"**/test_*.py" = ["F811"]
